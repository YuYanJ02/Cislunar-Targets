name: Update catalog and deploy Pages

# Refresh source catalogs, validate the unified snapshot, and publish the static site.

on:
  workflow_dispatch:
  schedule:
    - cron: "15 2 * * *"
  push:
    branches: [main]
    paths-ignore:
      - "public/data/catalog.json"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch Bill Gray catalog
        run: git clone --depth 1 https://github.com/Bill-Gray/tles.git .cache/bill-gray-tles
      - name: Refresh catalogs
        env:
          SPACETRACK_USERNAME: ${{ secrets.SPACETRACK_USERNAME }}
          SPACETRACK_PASSWORD: ${{ secrets.SPACETRACK_PASSWORD }}
        run: >-
          python scripts/update_catalog.py
          --catalog public/data/catalog.json
          --bill-gray-dir .cache/bill-gray-tles
          --output public/data/catalog.json
      - name: Validate catalog
        run: python scripts/validate_catalog.py public/data/catalog.json
      - name: Commit data changes
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/catalog.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh orbital catalogs"
            git push
          fi
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: update
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
